name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp clean verify
      - name: Verify packaged artifact excludes legacy lab classes
        shell: bash
        run: |
          artifact="target/java-product-inventory-service.jar"
          test -f "$artifact"
          if jar tf "$artifact" | grep -q '^BOOT-INF/classes/com/shaoyun/'; then
            echo "::error::Legacy lab classes must not be packaged in the service artifact"
            exit 1
          fi
